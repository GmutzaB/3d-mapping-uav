# Where the L2 sits on the airframe relative to the body center. Shared by every node
# that uses LiDAR points (obstacle_sectors, scan_recorder), so measure it once here.
# x forward, y left, z up in meters; roll/pitch/yaw in degrees.
# Measure these on the real frame. Mounted upside down = roll 180.
/**:
  ros__parameters:
    mount_x: 0.0
    mount_y: 0.0
    mount_z: 0.0
    mount_roll_deg: 0.0
    mount_pitch_deg: 0.0
    mount_yaw_deg: 0.0
